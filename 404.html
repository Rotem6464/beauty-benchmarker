<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <script>
            // GitHub Pages SPA redirect
            // This script takes the current URL path and query string and redirects
            // to the root index.html, preserving the path in a query parameter.
            // The React app will read this parameter and route to the correct page.

            var pathSegmentsToKeep = 1;
            var l = window.location;
            l.replace(
                    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
                    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
                    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                    l.hash
                  );
      </script>
  </head>

  </body>
